<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: libera a "área segura" do iPhone no CSS -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- O React troca este título pelo nome da marca e pelas não lidas: "(5) Talk Atendimento" -->
    <title>Talk Atendimento</title>
    <meta name="description" content="Talk Atendimento: painel de atendimento via WhatsApp para equipes." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#000000" />

    <!-- Aplica o tema salvo ANTES de a página aparecer: sem isso, quem usa
         o tema claro veria um "piscar" preto enquanto o React carrega -->
    <script>
      try {
        if (localStorage.getItem("talk-tema") === "claro") {
          document.documentElement.dataset.tema = "claro";
          document.querySelector('meta[name="theme-color"]').content = "#1f8f6a";
        }
      } catch {
        // aba anônima ou armazenamento bloqueado: segue no tema preto
      }
    </script>
  </head>
  <body>
    <!-- O React desenha o app inteiro aqui dentro -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

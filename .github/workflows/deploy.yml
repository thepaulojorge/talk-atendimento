# Publica o site no GitHub Pages a cada "git push" na main.
# O GitHub liga um computador, instala as dependências, roda o "npm run build"
# e publica a pasta dist (o site já "traduzido" para HTML, CSS e JS comuns).
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite rodar na mão, pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Dois pushes seguidos: o mais novo cancela o anterior
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o site (build)
        run: npm run build

      - name: Preparar o Pages
        uses: actions/configure-pages@v6

      - name: Enviar a pasta dist
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v5
